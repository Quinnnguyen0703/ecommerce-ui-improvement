<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa kem chống nắng L'Oréal Paris UV Defender</title>
  <desc id="desc">Tuýp kem chống nắng trắng với chi tiết màu cam vàng trên nền xanh nhạt.</desc>
  <defs>
    <linearGradient id="tube" x1="0" x2="1">
      <stop stop-color="#fff"/>
      <stop offset=".7" stop-color="#f8f6ef"/>
      <stop offset="1" stop-color="#e9e5d7"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" x2="1">
      <stop stop-color="#ff9a37"/>
      <stop offset="1" stop-color="#f36a24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#315543" flood-opacity=".17"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="#eff7f1"/>
  <circle cx="300" cy="286" r="205" fill="#e1f0e5"/>
  <circle cx="300" cy="286" r="163" fill="#f8fbf8"/>
  <ellipse cx="300" cy="505" rx="122" ry="17" fill="#306e51" opacity=".12"/>
  <g filter="url(#shadow)">
    <path d="M240 157q0-24 24-24h72q24 0 24 24l-12 282q-1 24-25 24h-46q-24 0-25-24z" fill="url(#tube)" stroke="#e0ddd3" stroke-width="3"/>
    <path d="M244 181h112l-4 93H248z" fill="url(#sun)"/>
    <path d="M275 461h50v34q0 9-9 9h-32q-9 0-9-9z" fill="#f1eee5" stroke="#ded9ca" stroke-width="2"/>
    <text x="300" y="162" fill="#2a2a27" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">L'ORÉAL PARIS</text>
    <text x="300" y="220" fill="#fff" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">UV</text>
    <text x="300" y="244" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">DEFENDER</text>
    <text x="300" y="311" fill="#424640" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">MATT &amp; FRESH</text>
    <text x="300" y="335" fill="#73776e" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">DAILY SUNSCREEN</text>
    <text x="300" y="373" fill="#4a554d" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">SPF 50+ PA++++</text>
    <text x="300" y="421" fill="#73776e" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">50 ml</text>
    <path d="M258 288l-4 132" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
