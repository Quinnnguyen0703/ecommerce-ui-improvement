<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa nước tẩy trang Bioderma Sensibio H2O</title>
  <desc id="desc">Chai nước tẩy trang màu hồng trên nền xanh nhạt.</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".5" stop-color="#f8ffff" stop-opacity=".68"/>
      <stop offset="1" stop-color="#d6e8df" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop stop-color="#ed7c9b"/>
      <stop offset="1" stop-color="#c84f73"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#315543" flood-opacity=".17"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="32" fill="#eff7f1"/>
  <circle cx="300" cy="286" r="205" fill="#e1f0e5"/>
  <circle cx="300" cy="286" r="163" fill="#f8fbf8"/>
  <ellipse cx="300" cy="505" rx="122" ry="17" fill="#306e51" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="235" y="100" width="130" height="57" rx="11" fill="url(#cap)"/>
    <rect x="228" y="145" width="144" height="336" rx="27" fill="url(#glass)" stroke="#d4e5dc" stroke-width="3"/>
    <path d="M248 175v280" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".7"/>
    <rect x="229" y="264" width="142" height="5" fill="#e997ac"/>
    <text x="300" y="226" fill="#263e35" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="2">BIODERMA</text>
    <text x="300" y="313" fill="#d25978" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">sensibio</text>
    <text x="300" y="343" fill="#43594d" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">H₂O</text>
    <text x="300" y="377" fill="#66776e" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">MICELLAR WATER</text>
    <text x="300" y="432" fill="#748078" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">500 ml</text>
  </g>
  <circle cx="115" cy="160" r="6" fill="#83b695" opacity=".6"/>
  <circle cx="482" cy="418" r="9" fill="#ed9cb0" opacity=".65"/>
</svg>
